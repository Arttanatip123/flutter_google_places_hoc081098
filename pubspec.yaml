  http: ^1.0.0
  rxdart: ^0.27.4
  rxdart_ext: ^0.2.2
  listenable_stream: ^1.1.0
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4

flutter:
  assets:
    - packages/flutter_google_places_hoc081098/assets/google_black.png
